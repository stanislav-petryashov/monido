services:
  demo:
    image: ghcr.io/stanislav-petryashov/monido:${DEMO_TAG:?set DEMO_TAG to a published version, for example 1.4.0}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_MODE: demo
      APP_URL: ${APP_URL:?set APP_URL in .env to the demo's public address}
      CLIENT_IP_HEADER: X-Forwarded-For
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-family}
      DEMO_INSTALL_URL: ${DEMO_INSTALL_URL:-https://github.com/stanislav-petryashov/monido}
    volumes:
      - demo-data:/data
volumes:
  demo-data:
