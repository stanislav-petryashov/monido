services:
  app:
    image: ghcr.io/stanislav-petryashov/monido:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # Localhost only: expose it through a reverse proxy with HTTPS (Caddy, Nginx). APP_PORT in .env
      # changes the host port (the container always listens on 8080)
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Optional settings (.env.example); without the file the app starts on its defaults (Compose 2.24 or newer)
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data

volumes:
  data:
