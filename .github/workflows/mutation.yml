name: mutation
# Mutation testing of src/domain (StrykerJS, stryker.config.mjs): whether the domain tests notice a changed formula.
# Weekly and on demand, not on pull requests: a run takes hours here (docs/development.md, "Mutation testing").
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  mutation:
    runs-on: ubuntu-latest
    # a local run took 29 minutes on 17 test runners, about 8 runner-hours; this runner has 4, so about 2–3 hours are
    # expected. Three times the local run would cut it off, so the limit is 5 hours (the hosted maximum is 6)
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # a full run (incremental mode is never on here); fails below thresholds.break
      # one test runner per core of the hosted runner (the config's 2 spares a shared machine)
      - run: npm run mutation -- --concurrency 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
