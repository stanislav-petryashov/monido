name: e2e
# Real-browser tests against the built app (playwright.config.ts, tests/e2e/): a broken route, a lazy chunk that fails
# to load, a server/client contract break or a sign-in regression. Separate from `check` so a browser problem is
# reported on its own; a local run is `npm run e2e`.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    # the target is under 6 minutes (a local run takes about 45 s with the build; npm ci and the browser install are most of the rest); 10 leaves room for a slow runner
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
