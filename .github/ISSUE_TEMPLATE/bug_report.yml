name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Use fictional numbers and names only: never paste real balances, account names, databases, backups, `.env` or tokens.
        A security problem goes to a private report instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or image tag (for example `1.0.0` or `latest` with the date you pulled it), or the commit if you run from source.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker
        - Node
    validations:
      required: true
  - type: dropdown
    id: auth-mode
    attributes:
      label: Auth mode
      description: "Settings → Family and access → Sign-in. Only none and demo are set with `AUTH_MODE` in `.env`."
      options:
        - password
        - telegram
        - none (environment only)
        - demo (environment only)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Records → Close month
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output (`docker compose logs app`) or the browser console. Check it for personal data first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal financial data from this report
          required: true
