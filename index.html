<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Install as an app (PWA, no service worker: nothing is cached offline); the colours are the --bg tokens of both themes -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Monido" />
    <meta name="theme-color" content="#ECEBF1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141318" media="(prefers-color-scheme: dark)" />
    <title>Monido</title>
    <!-- The theme is set before the first paint, otherwise dark would flash light (public/theme-init.js, blocking on purpose) -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
